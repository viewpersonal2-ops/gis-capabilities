name: Auto-Update Esri WMTS Capabilities

on:
  schedule:
    - cron: '0 0 * * 1' # Berjalan otomatis setiap hari Senin pukul 00:00 UTC
  workflow_dispatch:     # Tombol "Run workflow" manual di tab Actions GitHub

jobs:
  update-esri:
    runs-on: ubuntu-latest
    permissions:
      contents: write    # Memberikan izin bagi bot untuk commit & push file hasil generasi
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Update Script
        run: python esri/update_wmts.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add esri/WMTSCapabilities.xml
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-update Esri WMTSCapabilities.xml [skip ci]" && git push)
